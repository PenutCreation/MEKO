<!DOCTYPE html>
<html>
<head>
<title>Post Generator</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #020617;
  color: #e5e7eb;
  font-family: system-ui;
}

.box {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

h2 {
  text-align: center;
  font-size: 14px;
  margin: 4px 0 8px;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-bottom: 8px;
}

.tab {
  border: none;
  padding: 6px;
  font-size: 11px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  color: #94a3b8;
  background: #0f172a;
  transition: all .15s;
}

.tab.active {
  color: white;
  background: linear-gradient(135deg, #2563eb, #4f46e5);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.full { grid-column: 1 / -1; }

input, textarea, select {
  width: 100%;
  background: #000;
  border: 1px solid #1e293b;
  color: #e5e7eb;
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
}

textarea { min-height: 50px; }

label {
  font-size: 10px;
  opacity: .7;
  display: block;
  margin-bottom: 2px;
}

.btns {
  position: sticky;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin-top: 8px;
  background: #020617;
  padding-top: 6px;
}

.btns.conv-btns {
  grid-template-columns: repeat(3, 1fr);
}

button {
  border: none;
  padding: 6px;
  font-size: 11px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #2563eb, #4f46e5);
}

button.alt { background: #334155; }
button.danger { background: #dc2626; }
button.green { background: #16a34a; }

button:active { transform: scale(.95); }

pre {
  margin-top: 8px;
  background: #000;
  border: 1px solid #1e293b;
  padding: 8px;
  font-size: 11px;
  border-radius: 8px;
  max-height: 220px;
  overflow: auto;
  color: #22c55e;
  white-space: pre-wrap;
  word-break: break-word;
}

#convInput, #aiVideoSources {
  min-height: 120px;
  font-family: monospace;
  font-size: 11px;
}

.section { display: none; }
.section.active { display: block; }

.err {
  color: #f87171;
  font-size: 10px;
  margin-top: 4px;
}
</style>
</head>
<body>
<div class="box">
  <h2>⚡ POST GENERATOR</h2>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('gen')">Generator</button>
    <button class="tab" onclick="switchTab('conv')">Converter</button>
    <button class="tab" onclick="switchTab('ai')">AI Maker</button>
  </div>

  <!-- GENERATOR SECTION -->
  <div id="genSection" class="section active">
    <div class="grid">
      <div>
        <label>User</label>
        <select id="userSelect"></select>
      </div>

      <div>
        <label>🎲</label>
        <button onclick="randomUser()">Random</button>
      </div>

      <div>
        <label>Name</label>
        <input id="name">
      </div>

      <div>
        <label>Username</label>
        <input id="username">
      </div>

      <div class="full">
        <label>Content</label>
        <textarea id="content"></textarea>
      </div>

      <div>
        <label>Mode</label>
        <select id="dateMode">
          <option value="manual">Manual</option>
          <option value="estate">Estate</option>
        </select>
      </div>

      <div>
        <label>Date</label>
        <input id="customDate" type="datetime-local">
      </div>

      <div id="estateBox" class="full" style="display:none;">
        <div class="grid">
          <div>
            <label>Start</label>
            <input id="estateStart" type="datetime-local">
          </div>
          <div>
            <label>End</label>
            <input id="estateEnd" type="datetime-local">
          </div>
        </div>
      </div>

      <div>
        <label>Likes</label>
        <input id="likes" type="number">
      </div>

      <div>
        <label>Image</label>
        <input id="image">
      </div>

      <div>
        <label>Video</label>
        <input id="video">
      </div>

      <div class="full">
        <label>Iframe</label>
        <input id="iframe">
      </div>

      <div class="full">
        <label>Topic</label>
        <input id="topic" value="MyMeko">
      </div>
    </div>

    <div class="btns">
      <button onclick="generatePost()">Gen</button>
      <button class="alt" onclick="deleteLast()">Undo</button>
      <button class="alt" onclick="copyOutput('output')">Copy</button>
      <button class="danger" onclick="clearAll()">Clear</button>
    </div>

    <pre id="output"></pre>
  </div>

  <!-- CONVERTER SECTION -->
  <div id="convSection" class="section">
    <div class="grid">
      <div class="full">
        <label>Default Topic</label>
        <input id="convTopic" value="MyMeko">
      </div>
      <div class="full">
        <label>Paste JSON array or objects to convert</label>
        <textarea id="convInput" placeholder='[{"author":"florenz","content":"Hi","date":"Jun 26, 2022","likes":"4.2M"}, ...]'></textarea>
      </div>
    </div>
    <div id="convErr" class="err"></div>

    <div class="btns conv-btns">
      <button class="green" onclick="convertPosts()">Convert</button>
      <button class="alt" onclick="copyOutput('convOutput')">Copy</button>
      <button class="danger" onclick="clearConv()">Clear</button>
    </div>

    <pre id="convOutput"></pre>
  </div>

  <!-- AI MAKER SECTION -->
  <div id="aiSection" class="section">
    <div class="grid">
      <div class="full">
        <label>Engine Mode</label>
        <select id="aiEngineMode">
          <option value="gemini">Gemini API</option>
          <option value="local">Local Version (No AI)</option>
        </select>
      </div>
      <div class="full" id="apiKeyContainer">
        <label>Gemini API Key</label>
        <input id="aiApiKey" type="password" placeholder="Paste your API key here">
      </div>
      <div class="full">
        <label>Topic</label>
        <input id="aiTopic" value="MyMeko">
      </div>
      <div>
        <label>Date Mode</label>
        <select id="aiDateMode">
          <option value="now">Current Time</option>
          <option value="range">Date Range</option>
        </select>
      </div>
      <div id="aiDateRangeBox" class="full" style="display:none;">
        <div class="grid">
          <div>
            <label>Start Date</label>
            <input id="aiStart" type="datetime-local">
          </div>
          <div>
            <label>End Date</label>
            <input id="aiEnd" type="datetime-local">
          </div>
        </div>
      </div>
      <div class="full">
        <label>Paste Video Links (Use = for optional captions)</label>
        <textarea id="aiVideoSources" placeholder="https://domain.com/video.mp4 = Custom caption here"></textarea>
      </div>
    </div>
    <div id="aiErr" class="err"></div>

    <div class="btns conv-btns">
      <button class="green" id="aiGenBtn" onclick="generateAIPosts()">⚡ Generate</button>
      <button class="alt" onclick="copyOutput('aiOutput')">Copy</button>
      <button class="danger" onclick="clearAI()">Clear</button>
    </div>

    <pre id="aiOutput"></pre>
  </div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem("generated_posts") || "[]");
let users = JSON.parse(localStorage.getItem("generated_users") || "[]");

const firstNames = ["Ethan", "Aarav", "Marcus", "Kaelen", "Julian", "Liam", "Derek", "Chloe", "Victor", "Gavin", "Soren", "Kai", "Leo", "Zane", "Felix", "Nico", "Jaxon", "Ezra", "Rowan", "Asher"];
const lastNames = ["Caldwell", "Patel", "Vance", "Reyes", "Thorne", "Sterling", "Harrison", "Bennett", "Mercer", "Hayes", "Lindqvist", "Cross", "Vance", "Blackwood", "Sinclair", "Voss", "Holloway"];

const $ = id => document.getElementById(id);

$("aiApiKey").value = localStorage.getItem("gemini_api_key") || "";

/* ENGINE TOGGLE */
$("aiEngineMode").addEventListener("change", () => {
  $("apiKeyContainer").style.display = $("aiEngineMode").value === "gemini" ? "block" : "none";
});

/* AI DATE MODE TOGGLE */
$("aiDateMode").addEventListener("change", () => {
  $("aiDateRangeBox").style.display = $("aiDateMode").value === "range" ? "block" : "none";
});

/* TABS */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'gen') || (i === 1 && tab === 'conv') || (i === 2 && tab === 'ai'));
  });
  $('genSection').classList.toggle('active', tab === 'gen');
  $('convSection').classList.toggle('active', tab === 'conv');
  $('aiSection').classList.toggle('active', tab === 'ai');
}

/* USERS */
function refreshUsers() {
  $("userSelect").innerHTML = `<option value="">New</option>`;
  users.forEach((u, i) => {
    $("userSelect").innerHTML += `<option value="${i}">${u.name}</option>`;
  });
}
refreshUsers();

$("userSelect").addEventListener("change", () => {
  const idx = $("userSelect").value;
  if (idx === "") return;
  const u = users[parseInt(idx)];
  $("name").value = u.name;
  $("username").value = u.username;
});

/* DATE MODE TOGGLE */
$("dateMode").addEventListener("change", () => {
  $("estateBox").style.display = $("dateMode").value === "estate" ? "block" : "none";
});

/* DATE FORMAT */
function formatDate(d) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month = months[d.getMonth()];
  const day = d.getDate();
  const year = d.getFullYear();
  let hours = d.getHours();
  const minutes = String(d.getMinutes()).padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  return `${month} ${day} ${year} ${hours}:${minutes}${ampm}`;
}

/* RANDOM DATE */
function randomDateBetween(start, end) {
  const s = new Date(start).getTime();
  const e = new Date(end).getTime();
  if (isNaN(s) || isNaN(e)) return new Date();
  return new Date(Math.floor(Math.random() * (e - s + 1)) + s);
}

/* CLEAN EMOJIS */
function stripEmojis(str) {
  return str.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();
}

/* CLEAN VIDEO URL */
function cleanVideoURL(url) {
  return url.replace(/_lq(?=\.mp4$)/i, "");
}

/* GENERATE RANDOM PROFILE */
function getRandomProfile() {
  const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
  const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
  const tag = Math.floor(Math.random() * 89 + 10);
  return {
    name: `${fn} ${ln}`,
    username: `${fn.toLowerCase()}_${ln.toLowerCase()}_${tag}`
  };
}

/* GENERATE */
function generatePost() {
  const name = $("name").value.trim();
  const username = $("username").value.trim();
  if (!name || !username) return alert("Name + username required");

  if (!users.some(u => u.username === username)) {
    users.push({ name, username });
    localStorage.setItem("generated_users", JSON.stringify(users));
    refreshUsers();
  }

  let finalDate;
  if ($("dateMode").value === "estate") {
    finalDate = formatDate(randomDateBetween($("estateStart").value, $("estateEnd").value));
  } else {
    finalDate = $("customDate").value
      ? formatDate(new Date($("customDate").value))
      : formatDate(new Date());
  }

  posts.unshift({
    name,
    username,
    datePost: finalDate,
    content: $("content").value,
    iframe: $("iframe").value,
    video: cleanVideoURL($("video").value),
    image: $("image").value,
    likes: parseInt($("likes").value) || 0,
    liked: false,
    topic: $("topic").value
  });

  localStorage.setItem("generated_posts", JSON.stringify(posts));
  updateOutput();
  $("content").value = "";
}

function updateOutput() {
  let txt = "";
  posts.forEach(p => txt += JSON.stringify(p, null, 2) + ",\n");
  $("output").textContent = txt;
}
updateOutput();

function deleteLast() {
  posts.shift();
  localStorage.setItem("generated_posts", JSON.stringify(posts));
  updateOutput();
}

function clearAll() {
  posts = [];
  localStorage.setItem("generated_posts", JSON.stringify(posts));
  updateOutput();
}

function copyOutput(id) {
  navigator.clipboard.writeText($(id).textContent);
}

function randomUser() {
  const profile = getRandomProfile();
  $("name").value = profile.name;
  $("username").value = profile.username;
}

/* CONVERTER */
function parseLikes(val) {
  if (val === undefined || val === null || val === "") return 0;
  if (typeof val === "number") return val;
  const str = String(val).trim().toUpperCase().replace(/,/g, "");
  const num = parseFloat(str);
  if (str.endsWith("B")) return Math.round(num * 1_000_000_000);
  if (str.endsWith("M")) return Math.round(num * 1_000_000);
  if (str.endsWith("K")) return Math.round(num * 1_000);
  return parseInt(str) || 0;
}

function convertPosts() {
  $("convErr").textContent = "";
  let raw = $("convInput").value.trim();
  const topic = $("convTopic").value || "MyMeko";

  if (!raw.startsWith("[")) raw = "[" + raw + "]";
  raw = raw.replace(/,\s*]/g, "]");

  let arr;
  try {
    arr = JSON.parse(raw);
  } catch (e) {
    $("convErr").textContent = "❌ Invalid JSON: " + e.message;
    return;
  }

  if (!Array.isArray(arr)) {
    $("convErr").textContent = "❌ Expected an array of objects.";
    return;
  }

  const converted = arr.map(item => ({
    name: item.author || item.name || "",
    username: (item.author || item.username || "").toLowerCase().replace(/\s+/g, "_"),
    datePost: item.date || item.datePost || "",
    content: stripEmojis(item.content || ""),
    iframe: item.iframe || "",
    video: item.video || "",
    image: item.image || "",
    likes: parseLikes(item.likes),
    liked: false,
    topic: item.topic || topic
  }));

  let txt = "";
  converted.forEach(p => txt += JSON.stringify(p, null, 2) + ",\n");
  $("convOutput").textContent = txt;
}

function clearConv() {
  $("convInput").value = "";
  $("convOutput").textContent = "";
  $("convErr").textContent = "";
}

/* AI MAKER */
async function generateAIPosts() {
  $("aiErr").textContent = "";
  const engineMode = $("aiEngineMode").value;
  const apiKey = $("aiApiKey").value.trim();
  const rawLines = $("aiVideoSources").value.trim().split("\n").map(l => l.trim()).filter(Boolean);
  const topic = $("aiTopic").value || "MyMeko";
  const dateMode = $("aiDateMode").value;

  if (rawLines.length === 0) return $("aiErr").textContent = "❌ Paste at least one link.";

  let getDate = () => formatDate(new Date());
  if (dateMode === "range") {
    const s = $("aiStart").value;
    const e = $("aiEnd").value;
    if (!s || !e) return $("aiErr").textContent = "❌ Provide start and end dates.";
    getDate = () => formatDate(randomDateBetween(s, e));
  }

  const generatedList = [];

  if (engineMode === "local") {
    for (let line of rawLines) {
      let [url, customContent] = line.split("=").map(s => s.trim());
      const profile = getRandomProfile();
      
      generatedList.push({
        name: profile.name,
        username: profile.username,
        datePost: getDate(),
        content: customContent ? stripEmojis(customContent) : "",
        iframe: "",
        video: cleanVideoURL(url),
        image: "",
        likes: Math.floor(Math.random() * 240000 + 1000),
        liked: false,
        topic: topic
      });
    }
  } else {
    if (!apiKey) return $("aiErr").textContent = "❌ API Key is required!";
    localStorage.setItem("gemini_api_key", apiKey);
    $("aiGenBtn").disabled = true;
    $("aiGenBtn").textContent = "⏳ Generating...";

    for (let line of rawLines) {
      let [url, customContent] = line.split("=").map(s => s.trim());
      const cleanedUrl = cleanVideoURL(url);
      const filename = cleanedUrl.split("/").pop();

      if (customContent) {
        const profile = getRandomProfile();
        generatedList.push({
          name: profile.name,
          username: profile.username,
          datePost: getDate(),
          content: stripEmojis(customContent),
          iframe: "",
          video: cleanedUrl,
          image: "",
          likes: Math.floor(Math.random() * 240000 + 1000),
          liked: false,
          topic: topic
        });
        continue;
      }

      const prompt = `Analyze this video filename: "${filename}". Generate a post.
Return strictly a raw JSON object (no code block formatting) with keys:
- name: Unique human full name.
- username: Unique lowercase handle without spaces.
- content: Post caption (NO emojis).
- likes: Integer between 500 and 250000.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "API Request Failed");

        let resText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
        resText = resText.replace(/```json/g, "").replace(/```/g, "").trim();
        const parsed = JSON.parse(resText);

        generatedList.push({
          name: parsed.name || "Anonymous User",
          username: parsed.username || "anonymous_user",
          datePost: getDate(),
          content: stripEmojis(parsed.content || ""),
          iframe: "",
          video: cleanedUrl,
          image: "",
          likes: parsed.likes || Math.floor(Math.random() * 10000),
          liked: false,
          topic: topic
        });
      } catch (e) {
        console.error(e);
        $("aiErr").textContent = "❌ " + e.message;
      }
    }
    $("aiGenBtn").disabled = false;
    $("aiGenBtn").textContent = "⚡ Generate";
  }

  let txt = "";
  generatedList.forEach(p => txt += JSON.stringify(p, null, 2) + ",\n");
  $("aiOutput").textContent = txt;
}

function clearAI() {
  $("aiVideoSources").value = "";
  $("aiOutput").textContent = "";
  $("aiErr").textContent = "";
}
</script>
</body>
</html>
